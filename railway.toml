# Railway configuration for SWIMO multi-service deployment

[[services]]
name = "backend"
source = "backend"

[services.build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[services.deploy]
healthcheckPath = "/docs"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[[services]]
name = "frontend" 
source = "frontend"

[services.build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[services.deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure" 